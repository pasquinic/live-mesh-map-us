# Image du flasheur officiel Meshtastic (web-flasher), reconstruite chaque semaine pour suivre les nouveautés
name: Flasheur

# Édition monde : l'image du flasheur est publiée par le dépôt carte-live-meshtastic ; lancement manuel seulement
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: externes/flasher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/meshtastic-flasher:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
